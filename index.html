<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📍</text></svg>"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.6.0/dist/leaflet.css"
      integrity="sha512-xwE/Az9zrjBIphAcBb3F6JVqxf46+CDLwfLMHloNu6KEQCAWi6HcDUbeOfBIptF7tcCzusKFjFw2yuvEpDL9wQ=="
      crossorigin=""
    />
    <script
      defer
      src="https://unpkg.com/leaflet@1.6.0/dist/leaflet.js"
      integrity="sha512-gZwIG9x3wUXg2hdXF6+rVkLF/0Vi9U8D2Ntg4Ga5I5BZpVkVxlJWbSQtXPSiUTtC0TjtGOmxa1AJPuV0CPthew=="
      crossorigin=""
    ></script>

    <script type="module" src="js/main.js"></script>
    <title>Trailmark | Log your runs and rides on a map</title>
  </head>
  <body>
    <aside class="panel">
      <header>
        <h1 class="brand">Trail<span>mark</span></h1>
      </header>

      <nav class="controls" aria-label="Workout list options">
        <label for="sort" class="visually-hidden">Sort workouts</label>
        <select id="sort" class="controls__select">
          <option value="newest">Newest first</option>
          <option value="distance">Longest distance</option>
          <option value="duration">Longest duration</option>
        </select>
        <button type="button" class="controls__button controls__button--fit">Show all</button>
        <button type="button" class="controls__button controls__button--clear">Clear all</button>
      </nav>

      <p class="hint">Click anywhere on the map to add a workout.</p>
      <p class="stats" aria-live="polite"></p>

      <form class="entry-form is-hidden" aria-label="New workout">
        <div class="field">
          <label for="type" class="field__label">Type</label>
          <select id="type" class="field__input">
            <option value="running">Running</option>
            <option value="cycling">Cycling</option>
          </select>
        </div>
        <div class="field">
          <label for="distance" class="field__label">Distance</label>
          <input id="distance" type="number" step="any" class="field__input" placeholder="km" />
        </div>
        <div class="field">
          <label for="duration" class="field__label">Duration</label>
          <input id="duration" type="number" step="any" class="field__input" placeholder="min" />
        </div>
        <div class="field">
          <label for="cadence" class="field__label">Cadence</label>
          <input id="cadence" type="number" step="any" class="field__input" placeholder="steps/min" />
        </div>
        <div class="field field--hidden">
          <label for="elevation" class="field__label">Elev. gain</label>
          <input id="elevation" type="number" step="any" class="field__input" placeholder="meters" />
        </div>
        <p class="entry-form__error" role="alert"></p>
        <button class="entry-form__submit">Save</button>
      </form>

      <ul class="log" aria-label="Workouts"></ul>
    </aside>

    <main id="map" aria-label="Map"></main>
  </body>
</html>
